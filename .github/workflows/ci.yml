name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    # The examples import the sibling SDK from ../trix-sdk-python, so every
    # run-step executes from the examples checkout where that path resolves.
    defaults:
      run:
        working-directory: trix-sdk-python-examples

    steps:
      - uses: actions/checkout@v4
        with:
          # Check the examples out next to the SDK so `../trix-sdk-python` resolves.
          path: trix-sdk-python-examples

      - name: Check out the SDK
        uses: actions/checkout@v4
        with:
          repository: trixdb/trix-sdk-python
          path: trix-sdk-python

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        # Install the SDK from the local sibling checkout so CI tests against the
        # real current SDK rather than a published PyPI release.
        run: |
          uv pip install --system -e ../trix-sdk-python -e ".[dev,all]"

      - name: Run linting
        run: |
          ruff check .
          black --check .

      - name: Run type checking
        run: |
          bash scripts/typecheck.sh

      - name: Run tests
        run: |
          pytest --cov=examples --cov=use_cases --cov=recipes --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./trix-sdk-python-examples/coverage.xml
          fail_ci_if_error: false

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          find . -name "*.py" -type f -exec python -m py_compile {} +
