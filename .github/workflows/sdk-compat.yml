name: SDK Compatibility

on:
  # Triggered when new SDK versions are released
  repository_dispatch:
    types: [sdk-release]
  # Manual trigger
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version to test against'
        required: false
        default: 'latest'

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk-version: ["0.1.0", "0.1.1", "latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies with specific SDK version
        run: |
          if [ "${{ matrix.sdk-version }}" = "latest" ]; then
            uv pip install --system trixdb
          else
            uv pip install --system "trixdb==${{ matrix.sdk-version }}"
          fi
          uv pip install --system -e ".[dev]"

      - name: Run tests
        run: |
          pytest -v --tb=short

      - name: Report compatibility
        if: failure()
        run: |
          echo "::warning::Examples may not be compatible with SDK version ${{ matrix.sdk-version }}"

