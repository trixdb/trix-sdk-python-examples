name: Nightly Smoke Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

# Least privilege: read the repo, and open an issue on failure.
permissions:
  contents: read
  issues: write

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    environment: nightly

    # The examples import the sibling SDK from ../trix-sdk-python, so every
    # run-step executes from the examples checkout where that path resolves.
    defaults:
      run:
        working-directory: trix-sdk-python-examples

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Check the examples out next to the SDK so `../trix-sdk-python` resolves.
          path: trix-sdk-python-examples

      - name: Check out the SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: trixdb/trix-sdk-python
          path: trix-sdk-python

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Install dependencies
        # Install the SDK from the local sibling checkout so the smoke tests run
        # against the real current SDK rather than a published PyPI release.
        run: |
          uv pip install --system -e ../trix-sdk-python -e ".[dev,all]"

      - name: Run smoke tests (mocked)
        run: |
          pytest -v -m "not integration" --tb=short

      - name: Run integration tests
        if: ${{ env.TRIX_API_KEY != '' }}
        env:
          TRIX_API_KEY: ${{ secrets.TRIX_API_KEY }}
        run: |
          pytest -v -m "integration" --tb=short

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly smoke tests failed',
              body: `Nightly smoke tests failed on ${new Date().toISOString()}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'ci']
            })
